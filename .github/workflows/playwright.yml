name: Playwright Tests (Reusable)

on:
  workflow_call:
    inputs:
      run-api-tests:
        description: 'Set to true to run Playwright API tests'
        required: true
        type: boolean
      run-ui-tests:
        description: 'Set to true to run Playwright UI tests'
        required: true
        type: boolean
      node-version:
        description: 'Node.js version to use (e.g., lts/*)'
        required: false
        type: string
        default: 'lts/*'
    secrets:
      EMAIL_API:
        required: true
      PASSWORD_API:
        required: true
      API_URL:
        required: true

jobs:
  test:
    if: ${{ inputs.run-api-tests || inputs.run-ui-tests }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      EMAIL_API: ${{ secrets.EMAIL_API }}
      PASSWORD_API: ${{ secrets.PASSWORD_API }}
      API_URL: ${{ secrets.API_URL }}

    steps:
      - uses: actions/checkout@v4

      # --- Dependency Caching and Setup ---
      - name: Cache Node.js dependencies
        uses: actions/cache@v3
        id: cache-node
        with:
          path: |
            ~/.npm
            **/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/yarn.lock', '**/package-lock.json') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: |
          if [ -f yarn.lock ]; then
            npm install -g yarn
            yarn
          elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(jq -r '.devDependencies[\"@playwright/test\"]' package.json)" >> $GITHUB_OUTPUT

      # --- Playwright Cache & Install (Fixed) ---
      - name: Cache Playwright browsers
        uses: actions/cache@v3
        id: cache-playwright
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: ${{ inputs.run-ui-tests }}
        run: npx playwright install --with-deps

      # --- Optional Debug ---
      - name: Debug Playwright browsers
        if: ${{ inputs.run-ui-tests }}
        run: npx playwright show-browsers

      # --- Conditional Test Runs ---
      - name: Run Playwright API tests
        if: ${{ inputs.run-api-tests }}
        run: npx playwright test --project=api-tests

      - name: Run Playwright UI tests
        if: ${{ inputs.run-ui-tests }}
        run: npx playwright test --project=ui-tests

      # --- Report Upload ---
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: playwright-report
          path: tests/report/playwright-report/
          retention-days: 7
